[dependencies.bitflags]
version = "2"

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.env_logger]
version = "0.11"

[dependencies.fixed_decimal]
version = "0.7.2"

[dependencies.fontcull]
version = "2"
optional = true

[dependencies.fontcull-font-types]
version = "0.10"

[dependencies.fontcull-read-fonts]
version = "0.38"

[dependencies.fontcull-skrifa]
version = "0.39"

[dependencies.fontcull-write-fonts]
version = "0.44"

[dependencies.icu_calendar]
version = "2.2.1"
features = [
    "alloc",
    "serde",
]
default-features = false

[dependencies.icu_datetime]
version = "2.2.0"
features = ["serde"]
default-features = false

[dependencies.icu_decimal]
version = "2.2.0"
features = [
    "alloc",
    "serde",
]
default-features = false

[dependencies.icu_locale_core]
version = "2.2.0"

[dependencies.icu_provider]
version = "2.2.0"

[dependencies.icu_provider_blob]
version = "2.2.0"
features = ["alloc"]
default-features = false

[dependencies.icu_segmenter]
version = "2.2.0"
features = [
    "auto",
    "serde",
]
default-features = false

[dependencies.kurbo]
version = "0.12"

[dependencies.log]
version = "0.4"

[dependencies.pyo3]
version = "0.29"
features = [
    "extension-module",
    "abi3-py38",
]
optional = true

[dependencies.quick-xml]
version = "0.41"
features = ["serialize"]

[dependencies.rustc-hash]
version = "2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.skia-safe]
version = "0.99"
# 注意：不要加 "embed-freetype"。该特性会把产物名变成 ...-ftembed-...，
# 而 rust-skia 的 skia-binaries 0.99.0 里没有任何 ftembed 产物（404），
# 会回退到源码全量构建，而源码构建需 clone chromium/skia.googlesource.com（国内不可达）。
# Linux 上使用系统 freetype（默认行为）即可。
features = [
    "textlayout",
]

[dependencies.thiserror]
version = "2"

[dependencies.unicode-bidi]
version = "0.3.18"

[dependencies.unicode-bidi-mirroring]
version = "0.4"

[dependencies.unicode-joining-type]
version = "1"

[dependencies.unicode-normalization]
version = "0.1.25"

[dependencies.unicode-properties]
version = "0.1.4"

[dependencies.unicode-segmentation]
version = "1.13.2"

[dependencies.writeable]
version = "0.6.3"

[dependencies.zip]
version = "8"
features = ["deflate"]
default-features = false

[dev-dependencies.criterion]
version = "0.8"
features = ["html_reports"]

[dev-dependencies.lopdf]
version = "0.44"
default-features = false

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies.toml]
version = "1"
