[package]
name = "water_mark"
version = "0.1.0"
edition = "2024"

[dependencies]
# --- 核心：水印库 / CLI / PHP 扩展都用到的，必须保留 ---
# 0.36+ 才有 AES crypt filter 支持（0.33 只有 RC4），加密 PDF 必须靠它解密
lopdf = "0.45"
ab_glyph = "0.2"
log = "0.3.9"
zip = { version = "8", default-features = false, features = ["deflate"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
# 仅访问本机 unoserver 的明文 HTTP，故关闭默认特性（已确认 0.13 无 http1 开关，
# HTTP/1.1 常开；关掉默认特性只是去掉 TLS/charset 等我们不用的东西）。
reqwest = { version = "0.13.5", default-features = false }

# ---------------------------------------------------------------------------
# rpad（Python rpa 服务的 Rust 等价实现，`src/rpad.rs`）用到的依赖。
#
# 下面这些版本号都已在 Cargo.lock 里（其它 crate 的传递依赖），声明为直接依赖
# 不会给别的 bin 增加任何编译量，也不需要联网。
#
# 为什么不用 aws-sdk-s3 / aws-sdk-kms：AWS SDK for Rust 的 HTTPS 客户端只支持
# rustls（aws-lc-rs，构建需要 cmake）或 ring（Windows 构建需要 nasm），本机
# cmake / nasm / MSVC cl 都没有，编不过；所以这里用 reqwest(native-tls，Windows
# 走 schannel，纯 Rust) + 自带的 SigV4 签名（`src/rpad/sigv4.rs`）访问 S3 和 KMS。
#
# 客户端解密：mfront/crm 是 AES-GCM（数据密钥过 KMS），hhcrm 是 Fernet
# （AES-128-CBC + HMAC-SHA256），crm_v2 优先调 Go 编译的 kms_x64.dll。
# ---------------------------------------------------------------------------
toml = "0.8"
serde = { version = "1", features = ["derive"] }
url = "2"
libloading = "0.8"
tempfile = "3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = { version = "0.10", optional = true }
serde_json = { version = "1", optional = true }
# 合并不用 docx-rs：它是「模型级」库，read→write 会丢它不认识的元素（VML/图表/
# 复杂域），对本模板（含 header4 的域、docDefaults 差异）保真度不够；且合并语义
# （模板在前 + 分节符插入 + 页眉页脚沿用模板 + 页码连续）已由 `dxpdfd/merge.rs`
# 实现并验收过 —— rpad 通过 `#[path]` 直接复用那个模块，不重复造轮子。

# --- 可选重型依赖：默认不编译，按需打开 ---
# docx→pdf 转换引擎（docx2pdf / dxpdf2pdf / dxpdfd / rpad 用），feature `docx`
# 拉起整套 dxpdf + skia-bindings（→ chromium 源码，国内不可达）。
office2pdf = { version = "0.6.8", optional = true }
dxpdf = { version = "0.6.0", path = "vendor/dxpdf", optional = true }
# 方案验证用：纯 Rust 的 LibreOffice 兼容实现（走 docx_to_pdf_bytes）。
# 拉起 hayro + typst（编译量很大但不联网），feature `lopure`。
libreoffice-pure = { version = "0.5.8", optional = true }
# 临时：bench_glyph 基准直接调用 Skia，量化字形 path 生成成本。定位完成后删除。
# 不要加 "embed-freetype"：它会让产物名带 ftembed，而 0.99.0 没有该产物（404）→
# 回退源码构建 → 需要 clone chromium/skia.googlesource.com → 国内必失败。
skia-safe = { version = "0.99", features = ["textlayout"], optional = true }
# docx→pdf 转换服务（bin: dxpdfd）用：HTTP 服务端，feature `dxpdfd`。
axum = { version = "0.8.9", features = ["multipart"], optional = true }

[features]
# 默认空特性：构建 water_mark_cli / php_ext 时只编核心依赖（lopdf/ab_glyph/zip/...），
# 不会触发 dxpdf + skia-bindings 的 chromium 源码构建（国内不可达）。
#
# 按需打开重型特性：
#   --features docx       docx2pdf / dxpdf2pdf（需要 dxpdf + office2pdf）
#   --features dxpdfd     dxpdfd HTTP 服务（在 docx 之上再加 axum）
#   --features lopure     lopure2pdf（libreoffice-pure，会编译 hayro + typst）
#   --features skia       bench_glyph 基准（直接调 skia-safe）
#   --features rpad       rpad（AWS 客户端 + docx 引擎）
rpad = ["dep:aes-gcm", "reqwest/native-tls", "dep:serde_json", "docx"]
docx = ["dep:dxpdf", "dep:office2pdf"]
dxpdfd = ["dep:axum", "docx"]
lopure = ["dep:libreoffice-pure"]
skia = ["dep:skia-safe"]


[lib]
name = "water_mark"
crate-type = ["cdylib", "rlib"] # cdylib 用于 PHP (FFI), rlib 用于 main.rs 调用

# 临时：把 dxpdf 指向本地副本，便于给 paint 阶段加细粒度计时埋点。
# 定位完成后删除本段即可回到 crates.io 版本。
[patch.crates-io]
dxpdf = { path = "vendor/dxpdf" }

[[bin]]
name = "water_mark_cli"
path = "src/main.rs"

[[bin]]
name = "docx2pdf"
path = "src/docx2pdf.rs"
required-features = ["docx"]


[[bin]]
name="dxpdf2pdf"
path="src/dxpdf2pdf.rs"
required-features = ["docx"]

# 方案验证 A：libreoffice-pure（纯 Rust 实现，进程内转换）
[[bin]]
name = "lopure2pdf"
path = "src/lopure2pdf.rs"
required-features = ["lopure"]

# 方案验证 B：unoserver 常驻（真 LibreOffice，通过 unoconvert 客户端调用）
[[bin]]
name = "unoserver2pdf"
path = "src/unoserver2pdf.rs"

# 正式服务：常驻进程，对外提供 docx→pdf 的 HTTP 接口。
# 流程是「上传 DOCX → 返回 PDF 下载地址 → 客户端再下载」，转换引擎在进程内走 dxpdf + Skia。
[[bin]]
name = "dxpdfd"
path = "src/dxpdfd.rs"
required-features = ["dxpdfd"]

# 临时：定位 paint 阶段慢点用，定位完成后可删除。
[[bin]]
name = "bench_glyph"
path = "src/bench_glyph.rs"
required-features = ["skia"]

# Python 侧 `rpa`（app.py + rpa/views/api.py）的等价实现：
# GET /api/v1/rpa/parse_file?src_file_key=..&template_file_key=..&fund_cnname=..
#                            &letters_date=..&scheme=..
# 按 scheme 从 S3 取两份 DOCX（含客户端解密）→ 填模板占位符 → 拼接 → dxpdf 转 PDF
# → 直接返回 PDF 流。不再依赖 Word/COM，也不再依赖 Redis 全局锁。
#
# 需要 AWS SDK + dxpdf 引擎，所以带 `required-features`：
#   cargo build --release --bin rpad --features rpad
[[bin]]
name = "rpad"
path = "src/rpad.rs"
required-features = ["rpad"]