[package]
name = "watermark"
version = "0.1.0"
edition = "2021"
description = "water_mark 的 PHP 原生扩展（ext-php-rs），php.ini 配置后直接调用 watermark_add()"

[lib]
# PHP 扩展本质是一个 C 动态库
crate-type = ["cdylib"]

[dependencies]
# 系统为 PHP 8.0：禁用 enum 特性（该特性需要 PHP 8.1+），
# 本扩展只用 #[php_function]/#[php_module]，不涉及 PHP 枚举
ext-php-rs = { version = "0.15", default-features = false, features = ["runtime"] }
# 复用水印核心逻辑（water_mark crate 的 rlib）
water_mark = { path = ".." }

# 与根 crate 的 [profile.release] 对齐：从这里构建 PHP 扩展时，profile 取自
# 本文件而不是根目录，不同步的话 water_mark 核心逻辑享受不到 LTO / 单 codegen
# unit 优化。保留 strip=debuginfo（而非 symbols），避免影响 PHP 加载扩展时需要
# 的动态导出符号（get_module）。刻意保留默认 panic=unwind：核心库 FFI 入口用
# catch_unwind 兜底，改成 abort 会让宿主进程被畸形 PDF 干掉。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
